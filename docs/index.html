<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>阅流 · 小说沉浸阅读</title>
  <style>
    :root { --bg:#deecd9; --fg:#2d4435; --panel:#f7fbf5; --line:#b5cdb2; --accent:#55745d; }
    * { box-sizing: border-box; }
    body { margin:0; background:radial-gradient(circle at 80% 12%,#f7fbf5 0,transparent 24rem),var(--bg); color:var(--fg); font:17px/1.75 ui-serif,"Songti SC","Noto Serif CJK SC",serif; }
    main { width:min(960px,calc(100% - 32px)); margin:56px auto; }
    .hero { display:grid; grid-template-columns:1.2fr .8fr; gap:32px; align-items:center; }
    .icon { width:128px; height:128px; object-fit:contain; }
    h1 { margin:0; font-size:clamp(36px,7vw,68px); line-height:1.1; }
    .lead { max-width:660px; font-size:1.12em; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin:28px 0; }
    a.button { display:inline-block; padding:10px 16px; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--fg); text-decoration:none; font-family:system-ui,sans-serif; font-weight:650; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:0 18px 60px #2d443510; }
    .features { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .features div { padding:18px; border-radius:14px; background:#e7f1e3; }
    strong { display:block; margin-bottom:4px; }
    .small { color:#58715e; font-size:.92em; }
    img.preview { display:block; width:100%; border:1px solid var(--line); border-radius:12px; box-shadow:0 14px 40px #2d443520; }
    footer { margin-top:28px; color:#55715d; font:14px/1.7 system-ui,sans-serif; }
    @media (prefers-color-scheme:dark) {
      :root { --bg:#1c2025; --fg:#d6d4cc; --panel:#272d33; --line:#45505b; --accent:#9fc3a1; }
      body { background:radial-gradient(circle at 80% 12%,#30383c 0,transparent 24rem),var(--bg); }
      .features div { background:#303a34; }
      .small,footer { color:#b1b8b0; }
    }
    @media (max-width:760px) { .hero { grid-template-columns:1fr; } .features { grid-template-columns:1fr; } .icon { width:96px; height:96px; } }
  </style>
</head>
<body>
<main>
  <section class="hero">
    <div>
      <img class="icon" src="../icons/128.png" alt="阅流图标">
      <h1>阅流</h1>
      <p class="lead">把中文网页小说整理成清爽、护眼、可连续阅读的沉浸视图。</p>
      <div class="actions">
        <a class="button" href="https://github.com/lj0014/novel-flow-extension">查看源码与安装包</a>
        <a class="button" href="privacy.html">隐私政策</a>
        <a class="button" href="https://github.com/lj0014/novel-flow-extension/issues">反馈问题</a>
      </div>
      <p class="small">Chrome Manifest V3 · 按需运行 · 本地处理 · 不上传阅读数据</p>
    </div>
    <img class="preview" src="preview.png" alt="阅流阅读界面">
  </section>
  <section class="features">
    <div><strong>三种主题</strong>护眼绿、纸张和深色阅读界面。</div>
    <div><strong>连续阅读</strong>同章分页合并，自动续页和续章。</div>
    <div><strong>站点适配</strong>内置常见小说 CMS 规则，也可保存自定义 CSS 选择器。</div>
  </section>
  <footer>
    NovelFlow 仅整理用户有权访问的页面，不绕过登录、VIP、付费、订阅、验证码或安全限制。
  </footer>
</main>
</body>
</html>
